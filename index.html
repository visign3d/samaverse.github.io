<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samaversum Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #111111; color: #ffffff; }
        .card-bg { background-color: #222222; }
        .accent-red { color: #E60023; }
        .bg-accent-red { background-color: #E60023; }
        .transition-all { transition: all 0.3s ease; }
        .diagnostic-log { white-space: pre-wrap; word-break: break-all; font-family: monospace; font-size: 0.75rem; }
    </style>
</head>
<body class="font-sans antialiased">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-[#1A1A1A] px-4 py-3 shadow-lg flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <span>🎨</span> Samaversum Gallery
        </h1>
        <div class="flex gap-2">
            <button onclick="showContact()" class="p-2 hover:bg-white/10 rounded-full" title="Send Message">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </button>
            <button onclick="loadArtworks()" class="p-2 hover:bg-white/10 rounded-full" title="Refresh">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            </button>
            <button onclick="startSlideshow()" class="p-2 hover:bg-white/10 rounded-full" title="Slideshow">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 8 6 4-6 4Z"/></svg>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-4">
        <!-- Diagnostic/Log Area -->
        <div id="diagnosticLog" class="hidden mb-4 p-4 bg-gray-900 border border-gray-700 rounded-lg text-orange-400 diagnostic-log"></div>

        <!-- Loading State -->
        <div id="loading" class="flex justify-center items-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#E60023]"></div>
        </div>

        <!-- Grid -->
        <div id="galleryGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-4"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            <p>No records found</p>
            <button onclick="loadArtworks()" class="mt-4 bg-accent-red px-6 py-2 rounded-lg text-white hover:bg-red-700">Retry Fetch</button>
        </div>
    </main>

    <!-- Presentation Modal -->
    <div id="slideshowModal" class="fixed inset-0 z-[100] bg-black hidden flex-col">
        <div class="absolute top-4 right-4 z-[110] flex gap-2">
             <button onclick="closeSlideshow()" class="p-2 bg-black/50 hover:bg-black/80 rounded-full text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
        <div class="flex-1 flex items-center justify-center relative group">
            <img id="slideshowImage" src="" class="max-h-full max-w-full object-contain transition-opacity duration-700" alt="Slideshow image">

            <!-- Controls -->
            <button onclick="prevSlide()" class="absolute left-4 p-4 bg-black/20 hover:bg-black/50 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button onclick="nextSlide()" class="absolute right-4 p-4 bg-black/20 hover:bg-black/50 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
        </div>
        <div id="slideshowInfo" class="p-6 bg-gradient-to-t from-black to-transparent text-center">
            <h2 id="slideshowTitle" class="text-xl font-bold mb-2"></h2>
            <p id="slideshowDesc" class="text-gray-300"></p>
        </div>
    </div>

    <!-- Contact Modal -->
    <div id="contactModal" class="fixed inset-0 z-[100] bg-black/80 hidden items-center justify-center p-4">
        <div class="bg-[#1E1E1E] w-full max-w-md rounded-2xl overflow-hidden p-6 shadow-2xl">
            <h2 class="text-xl font-bold mb-4">Send Message to Samaversum</h2>
            <div class="space-y-4">
                <input type="text" id="contactName" placeholder="Your Name" class="w-full bg-[#2A2A2A] border-none rounded-lg p-3 text-white focus:ring-2 focus:ring-[#E60023] outline-none">
                <input type="email" id="contactEmail" placeholder="Your Email" class="w-full bg-[#2A2A2A] border-none rounded-lg p-3 text-white focus:ring-2 focus:ring-[#E60023] outline-none">
                <textarea id="contactMessage" placeholder="Message" rows="4" class="w-full bg-[#2A2A2A] border-none rounded-lg p-3 text-white focus:ring-2 focus:ring-[#E60023] outline-none"></textarea>
                <div class="flex justify-end gap-2 mt-4">
                    <button onclick="closeContact()" class="px-4 py-2 text-gray-400 hover:text-white">Cancel</button>
                    <button onclick="sendEmail()" class="bg-accent-red px-6 py-2 rounded-lg text-white hover:bg-red-700">Send Message</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jldabrktsutbeuxxyjjf.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_prpooTOV73w8v6GM13bE2Q_yBI9cyw7';
        const TABLE_NAME = 'painting';
        const BUCKET_NAME = 'images';

        // Renamed variable to avoid name conflict with window.supabase global namespace object
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let artworks = [];
        let currentIndex = 0;
        let slideshowTimer = null;

        function addLog(msg) {
            const logEl = document.getElementById('diagnosticLog');
            logEl.classList.remove('hidden');
            logEl.textContent += (logEl.textContent ? '\n' : '') + msg;
            console.log(msg);
        }

        async function loadArtworks() {
            showLoading(true);
            document.getElementById('diagnosticLog').textContent = '';
            document.getElementById('diagnosticLog').classList.add('hidden');

            try {
                const { data, error } = await supabaseClient
                    .from(TABLE_NAME)
                    .select('*');

                if (error) throw error;

                if (!data || data.length === 0) {
                    addLog(`No records found in table "${TABLE_NAME}".`);
                } else {
                    addLog(`Successfully fetched ${data.length} records.`);
                }

                artworks = data.map((row, index) => {
                    const id = row.id || `painting_${index}`;
                    let title = row.title || row.name || '';
                    let description = row.description || '';
                    let imageRef = row.image_large || row.image_url || row.url || row.image || row.path || row.file_name || '';

                    if (!imageRef) {
                        addLog(`Row ${index} skipped: missing image reference.`);
                        return null;
                    }

                    // Normalize reference strings by removing extra spaces and leading/trailing slashes
                    imageRef = imageRef.toString().trim().replace(/^\/+/, '').replace(/\/+$/, '');

                    let imageUrl = imageRef;
                    if (!imageRef.startsWith('http')) {
                        // Match exact logic from main.dart
                        const fullPath = imageRef.startsWith('public/') ? imageRef : `public/${imageRef}`;
                        const { data: urlData } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(fullPath);
                        imageUrl = urlData?.publicUrl || '';
                    }

                    if (!title) {
                        title = imageRef.split('/').pop().split('.')[0]
                            .replace(/[-_]/g, ' ')
                            .split(' ')
                            .map(w => w.charAt(0).toUpperCase() + w.slice(1))
                            .join(' ');
                    }

                    return { id, title, description, imageUrl };
                }).filter(a => a !== null);

                // Shuffle element arrays randomly
                artworks.sort(() => Math.random() - 0.5);
                renderGrid();

                if (artworks.length === 0) {
                    document.getElementById('emptyState').classList.remove('hidden');
                } else {
                    document.getElementById('emptyState').classList.add('hidden');
                }

            } catch (err) {
                addLog(`Supabase Error: ${err.message}`);
                console.error(err);
            } finally {
                showLoading(false);
            }
        }

        function renderGrid() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = artworks.map((art, idx) => `
                <div onclick="openSlideshow(${idx})" class="card-bg rounded-xl overflow-hidden cursor-pointer hover:scale-[1.02] transition-all group relative">
                    <div class="aspect-[3/4] overflow-hidden bg-[#2a2a2a] flex items-center justify-center">
                        <img src="${art.imageUrl}"
                             onerror="this.onerror=null; this.src='https://via.placeholder.com/300x400?text=Image+Load+Error'; addLog('Error loading image URL: ' + '${art.imageUrl}');"
                             class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                             alt="${art.title}"
                             loading="lazy">
                    </div>
                    <div class="p-3 bg-gray-200 text-black">
                        <h3 class="font-bold truncate text-sm">${art.title}</h3>
                    </div>
                </div>
            `).join('');
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        // Slideshow Logic
        function openSlideshow(index) {
            currentIndex = index;
            updateSlideshow();
            document.getElementById('slideshowModal').classList.remove('hidden');
            document.getElementById('slideshowModal').classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeSlideshow() {
            document.getElementById('slideshowModal').classList.add('hidden');
            document.getElementById('slideshowModal').classList.remove('flex');
            document.body.style.overflow = '';
            stopSlideshowTimer();
        }

        function updateSlideshow() {
            const art = artworks[currentIndex];
            const img = document.getElementById('slideshowImage');
            img.style.opacity = 0;
            setTimeout(() => {
                img.src = art.imageUrl;
                img.onerror = () => {
                    addLog('Slideshow image load error: ' + art.imageUrl);
                    img.src = 'https://via.placeholder.com/800x600?text=Image+Load+Error';
                };
                document.getElementById('slideshowTitle').textContent = art.title;
                document.getElementById('slideshowDesc').textContent = art.description;
                img.style.opacity = 1;
            }, 300);
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % artworks.length;
            updateSlideshow();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + artworks.length) % artworks.length;
            updateSlideshow();
        }

        function startSlideshow() {
            if (artworks.length === 0) return;
            openSlideshow(0);
            startSlideshowTimer();
        }

        function startSlideshowTimer() {
            stopSlideshowTimer();
            slideshowTimer = setInterval(nextSlide, 5000);
        }

        function stopSlideshowTimer() {
            if (slideshowTimer) clearInterval(slideshowTimer);
        }

        // Contact Logic
        function showContact() {
            document.getElementById('contactModal').classList.remove('hidden');
            document.getElementById('contactModal').classList.add('flex');
        }

        function closeContact() {
            document.getElementById('contactModal').classList.add('hidden');
            document.getElementById('contactModal').classList.remove('flex');
        }

        function sendEmail() {
            const name = document.getElementById('contactName').value.trim();
            const email = document.getElementById('contactEmail').value.trim();
            const message = document.getElementById('contactMessage').value.trim();
            const subject = encodeURIComponent(`Samaversum Inquiry from ${name}`);
            const body = encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\nMessage:\n${message}`);
            window.location.href = `mailto:samaversum@gmail.com?subject=${subject}&body=${body}`;
            closeContact();
        }

        // Initialize
        loadArtworks();

        window.addEventListener('keydown', (e) => {
            if (document.getElementById('slideshowModal').classList.contains('hidden')) return;
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 'Escape') closeSlideshow();
        });
    </script>
</body>
</html>
